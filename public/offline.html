<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors connexion — GJH Gestion</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 26rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
    p { color: #475569; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1.25rem; }
    a, button { display: inline-block; padding: .75rem 1.25rem; border-radius: .75rem; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; }
    .main { background: #1d4ed8; color: #fff; }
    .alt { background: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="64" height="64" alt="">
    <h1>Pas de connexion Internet</h1>
    <p>Cette page n'a pas encore été gardée sur cet appareil. Le tableau de bord et la caisse marchent sans Internet : les ventes sont enregistrées ici et envoyées toutes seules au retour du réseau.</p>
    <div class="actions">
      <a class="main" href="/caisse">Ouvrir la caisse</a>
      <a class="alt" href="/dashboard">Tableau de bord</a>
      <button class="alt" type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </main>
</body>
</html>
